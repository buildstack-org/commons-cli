name: Avrea Test Intelligence

# Runs this project's own tests on Avrea runners. Maven Surefire writes its
# reports unasked, so nothing here asks for one. Manual only; not part of the
# upstream project.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: buildstack-dev-varjo
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run Maven tests
        run: mvn -B -ntp test -Drat.skip=true -Dcheckstyle.skip=true -Dspotbugs.skip=true -Dpmd.skip=true -Danimal.sniffer.skip=true -Djapicmp.skip=true
      - name: Describe report files
        if: always()
        run: |
          cd target/surefire-reports
          echo "::notice::entities=$(cat TEST-*.xml | grep -o '&#[0-9a-zA-Z]*;' | sort | uniq -c | tr '\n' ' ' | tr '&' '@')"
          echo "::notice::nonascii=$(cat TEST-*.xml | LC_ALL=C grep -c '[^ -~]' ) ctrl=$(cat TEST-*.xml | LC_ALL=C grep -c '[[:cntrl:]]') total_bytes=$(cat TEST-*.xml | wc -c) biggest=$(ls -S TEST-*.xml | head -1) $(ls -S TEST-*.xml | head -1 | xargs wc -c | cut -d' ' -f1)"
          echo "::notice::other=$(ls | grep -v '^TEST-.*xml$' | grep -v 'txt$' | head -5 | tr '\n' ' ') mtime=$(stat -c '%y' $(ls TEST-*.xml | head -1)) now=$(date -u +%FT%T)"

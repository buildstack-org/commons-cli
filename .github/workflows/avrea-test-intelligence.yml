name: Avrea Test Intelligence

# Runs this project's own tests on Avrea runners. Maven Surefire writes its
# reports unasked, so nothing here asks for one. Manual only; not part of the
# upstream project.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: buildstack-dev-varjo
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run Maven tests
        run: mvn -B -ntp test -Drat.skip=true -Dcheckstyle.skip=true -Dspotbugs.skip=true -Dpmd.skip=true -Danimal.sniffer.skip=true -Djapicmp.skip=true
      - name: List report files
        if: always()
        run: |
          pwd
          find . -name '*.xml' -newer pom.xml -not -path './.git/*' -not -path './src/*' | sort | sed -n 1,80p
          find . -name 'TEST-*.xml' | wc -l
          grep -c '<testcase' target/surefire-reports/TEST-*.xml | awk -F: '{s+=$2} END {print "testcases", s}'
          grep -l 'rerunFailure\|flakyFailure\|<testsuites' target/surefire-reports/*.xml || true
          ls -la target/surefire-reports | sed -n 1,12p

name: Avrea Test Intelligence

# Runs this project's own tests on Avrea runners. Maven Surefire writes its
# reports unasked, so nothing here asks for one. Manual only; not part of the
# upstream project.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: buildstack-dev-varjo
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run Maven tests
        run: mvn -B -ntp test -Drat.skip=true -Dcheckstyle.skip=true -Dspotbugs.skip=true -Dpmd.skip=true -Danimal.sniffer.skip=true -Djapicmp.skip=true
      - name: Describe report files
        if: always()
        run: |
          cat > "$RUNNER_TEMP/stats.py" <<'PY'
          import glob, xml.etree.ElementTree as ET, collections
          n = 0; out = collections.Counter(); mx = collections.Counter(); odd = []
          for f in sorted(glob.glob("target/surefire-reports/TEST-*.xml")):
              root = ET.parse(f).getroot()
              for tc in root.iter("testcase"):
                  n += 1
                  name, cls, t = tc.get("name"), tc.get("classname"), tc.get("time")
                  kinds = [c.tag for c in tc]
                  out[",".join(sorted(set(kinds))) or "passed"] += 1
                  mx["name"] = max(mx["name"], len((name or "").encode())); mx["cls"] = max(mx["cls"], len((cls or "").encode()))
                  try:
                      mx["time_ms"] = max(mx["time_ms"], int(float(t) * 1000))
                  except Exception:
                      odd.append("time=%r" % t)
                  if not name or name != name.strip() or not cls or cls != cls.strip():
                      odd.append("name=%r cls=%r" % (name, cls))
                  for c in tc:
                      m = c.get("message")
                      if c.tag in ("failure", "error", "skipped") and m is not None and (m != m.strip() or not m):
                          odd.append("%s msg=%r" % (c.tag, m[:40]))
          print("cases=%d outcomes=%s max=%s odd=%d %s" % (n, dict(out), dict(mx), len(odd), odd[:8]))
          PY
          echo "::notice::$(python3 "$RUNNER_TEMP/stats.py" 2>&1 | tail -1)"
          echo "::notice::alljunit=$(find . -name '*.xml' -not -path './.git/*' | xargs grep -l '<testsuite' 2>/dev/null | grep -v '^./target/surefire-reports/TEST-' | head -8 | tr '\n' ' ') count=$(find . -name '*.xml' -not -path './.git/*' | xargs grep -l '<testsuite' 2>/dev/null | wc -l)"

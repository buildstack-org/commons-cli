name: Avrea Test Intelligence

# Runs this project's own tests on Avrea runners. Maven Surefire writes its
# reports unasked, so nothing here asks for one. Manual only; not part of the
# upstream project.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: buildstack-dev-varjo
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run Maven tests
        run: mvn -B -ntp test -Drat.skip=true -Dcheckstyle.skip=true -Dspotbugs.skip=true -Dpmd.skip=true -Danimal.sniffer.skip=true -Djapicmp.skip=true
      - name: Describe report files
        if: always()
        run: |
          cd target/surefire-reports
          f=$(ls TEST-*.xml | head -1)
          echo "::notice::files=$(ls TEST-*.xml | wc -l) first=$f bytes=$(wc -c < $f) maxline=$(awk '{ if (length($0) > m) m = length($0) } END { print m }' $f) props=$(grep -c '<property ' $f)"
          echo "::notice::head=$(head -c 400 $f | tr '\n"<>' ' ._.' )"
          echo "::notice::propnames=$(grep -o '<property name="[^"]*"' $f | sed 's/<property name=//' | tr -d '"' | tr '\n' ' ' | cut -c1-900)"
          echo "::notice::owner=$(stat -c '%U:%G %a' $f) dir=$(stat -c '%U:%G %a' .) me=$(id -un) pwd=$(pwd | sed 's/[^/]//g' | wc -c) link=$(test -L ../../target && echo yes || echo no)"
